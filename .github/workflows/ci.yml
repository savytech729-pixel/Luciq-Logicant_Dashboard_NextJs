name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Smoke tests
        run: pnpm test:smoke

      - name: Build
        env:
          DATABASE_URL: mongodb://localhost:27017/ci-placeholder
          JWT_SECRET: ci-placeholder-secret
          GEMINI_API_KEY: ci-placeholder-key
        run: pnpm build
